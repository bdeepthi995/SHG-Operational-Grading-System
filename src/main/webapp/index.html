<!DOCTYPE html>
<html>
<head>
    <title>SHG Grading System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: bold;
            transition: transform 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        h2 {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <div class="display-1"></div>
                        <h2>SHG Grading System</h2>
                        <p class="text-muted">Self-Help Group Evaluation Portal</p>
                    </div>
                    <form action="ValidateGroup" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Group ID</label>
                            <input type="number" name="groupId" class="form-control" placeholder="Enter Group ID" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Leader Name</label>
                            <input type="text" name="leader" class="form-control" placeholder="Enter Leader Name" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Verify and Continue</button>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <small class="text-muted">
                            <strong>Valid Groups:</strong> 101-105<br>
                            <strong>Leaders:</strong> Rani, Sita, Latha, Anitha, Sunitha
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
